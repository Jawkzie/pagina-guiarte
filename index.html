    <script>
      // Observer para animaciones con scroll (compatible con plugin de Tailwind)
      const observerOptions = {
        root: null,
        rootMargin: '0px',
        threshold: 0.1
      };

      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('animate-fade-in-down');
          }
        });
      }, observerOptions);

      // Observar elementos cuando el DOM esté listo
      document.addEventListener('DOMContentLoaded', () => {
        const elementsToAnimate = document.querySelectorAll('.quote-text, .sponsors h1');
        
        elementsToAnimate.forEach(element => {
          // Remover la clase de animación inicialmente
          element.classList.remove('animate-fade-in-down');
          // Observar el elemento
          observer.observe(element);
        });
      });
    </script>
